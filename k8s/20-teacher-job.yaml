# Indexed Job: 2 pods run concurrently, JOB_COMPLETION_INDEX -> SHARD_INDEX (0 and 1).
# Ollama runs on the laptop (host): `OLLAMA_HOST=0.0.0.0 ollama serve` and `ollama pull phi3.5`.
apiVersion: batch/v1
kind: Job
metadata: {name: teacher-labelling, namespace: pipeline}
spec:
  completions: 2
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: worker
          image: teacher-worker:1
          imagePullPolicy: IfNotPresent
          env:
            - name: SHARD_INDEX
              valueFrom: {fieldRef: {fieldPath: "metadata.annotations['batch.kubernetes.io/job-completion-index']"}}
            - {name: SHARD_COUNT, value: "2"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc:8333"}
            - {name: OLLAMA_HOST, value: "http://172.29.48.1:11434"}
          envFrom: [{secretRef: {name: s3-credentials}}]
