# Secret "seaweed-s3-config" (key s3.json) is created by scripts/secrets.sh; no credentials live in Git.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: seaweed-data, namespace: data}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: seaweedfs, namespace: data}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: seaweedfs}}
  template:
    metadata: {labels: {app: seaweedfs}}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.68
          args: ["server", "-dir=/data", "-s3", "-s3.config=/etc/s3/s3.json", "-master.volumeSizeLimitMB=512"]
          ports: [{containerPort: 8333, name: s3}]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3cfg, mountPath: /etc/s3, readOnly: true}
          readinessProbe: {tcpSocket: {port: 8333}, initialDelaySeconds: 5, periodSeconds: 5}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: seaweed-data}}
        - {name: s3cfg, secret: {secretName: seaweed-s3-config}}
---
apiVersion: v1
kind: Service
metadata: {name: seaweedfs, namespace: data}
spec:
  selector: {app: seaweedfs}
  ports: [{name: s3, port: 8333, targetPort: 8333}]
