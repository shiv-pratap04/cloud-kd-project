apiVersion: apps/v1
kind: Deployment
metadata: {name: parser, namespace: app}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: parser}}
  template:
    metadata: {labels: {app: parser}}
    spec:
      containers:
        - name: parser
          image: parser-service:1
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: MODEL_URI, value: "s3://models/v1/"}
            - {name: MODEL_VERSION, value: "v1"}
            - {name: S3_ENDPOINT, value: "http://seaweedfs.data.svc:8333"}
            - {name: MAX_NEW_TOKENS, value: "80"}
            - {name: FAULT_INJECT, value: "0"}
          envFrom: [{secretRef: {name: s3-credentials}}]
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits:   {cpu: "1",  memory: 1Gi}
          startupProbe:   {httpGet: {path: /healthz, port: 8000}, periodSeconds: 5, failureThreshold: 60}
          livenessProbe:  {httpGet: {path: /healthz, port: 8000}, periodSeconds: 10, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /readyz,  port: 8000}, periodSeconds: 5, failureThreshold: 2}
---
apiVersion: v1
kind: Service
metadata: {name: parser, namespace: app}
spec:
  selector: {app: parser}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: parser, namespace: app}
spec:
  rules:
    - http:
        paths:
          - {path: /parse, pathType: Prefix, backend: {service: {name: parser, port: {number: 80}}}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: parser, namespace: app}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: parser}
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
